    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VR CAP" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="VR Cognitive Assessment Platform - védelmi, munkaalkalmassági és sportági kognitív mérés WebXR-ben." />
    <title>VR CAP — Cognitive Assessment Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"

    <div id="overlay" class="xr-overlay"></div>
    <noscript>Ehhez az alkalmazáshoz JavaScript szükséges.</noscript>
    <script type="module" src="/src/main.ts"></script>

</html>
